<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Will you be my Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --bg1: #ffd6e7;
        --bg2: #ffeef6;
        --card: #ffffffcc;
        --yes: #ff3b7a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1));
        font-family: system-ui, sans-serif;
        overflow: hidden;
        padding: 16px;
      }

      .card {
        position: relative;
        width: 95vw;
        max-width: 480px;
        min-height: 550px;
        padding: 26px 22px;
        background: var(--card);
        backdrop-filter: blur(10px);
        border-radius: 22px;
        text-align: center;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden; /* Empêche le bouton de sortir du cadre blanc */
      }

      .img-container {
        position: relative;
        width: fit-content;
        margin: 0 auto 15px;
      }

      .custom-img {
        width: min(250px, 60vw);
        border-radius: 15px;
        display: block;
      }

      h1 {
        font-size: clamp(22px, 5vw, 32px);
        margin: 12px 0 18px;
      }

      .button-zone {
        position: relative;
        width: 100%;
        height: 150px; /* Zone d'évolution */
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      button {
        padding: clamp(10px, 2vw, 18px) clamp(15px, 4vw, 30px);
        font-size: clamp(16px, 2.5vw, 22px);
        font-weight: 800;
        border-radius: 15px;
        border: none;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
        user-select: none;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
        -webkit-tap-highlight-color: transparent;
      }

      #yesBtn {
        background: var(--yes);
        color: #fff;
        position: relative;
        z-index: 1; /* Derrière le bouton Non */
      }

      #noBtn {
        background: #e5e7eb;
        color: #111827;
        position: relative;
        z-index: 999; /* Toujours devant */
        white-space: nowrap;
        touch-action: none;
      }

      .hint {
        font-weight: bold;
        margin-top: 10px;
        min-height: 1.5em;
      }

      .result {
        display: none;
      }
      .fireworks {
        width: 100%;
        max-width: 300px;
        border-radius: 15px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div id="main-content">
        <div class="img-container">
          <img src="IMG_8374.JPG" alt="Valentine" class="custom-img" />
        </div>

        <h1>Charlise, veux-tu être ma Valentine ?</h1>

        <section class="button-zone">
          <button id="yesBtn">Evidemment</button>
          <button id="noBtn">Non 🙄</button>
        </section>

        <div class="hint" id="hint"></div>
      </div>

      <section class="result" id="result">
        <h2>YOUPIIIIIIIII ! 🎉</h2>
        <img
          class="fireworks"
          src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3g2bXN3cTB6dWZyaWswNHk2aGJzdm14azg1NDRucDJuZWFzMm8xdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/l6jTwS2sCZ1ztTwgL8/200w.webp"
        />
      </section>
    </main>

    <script>
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const result = document.getElementById("result");
      const mainContent = document.getElementById("main-content");
      const hint = document.getElementById("hint");
      const card = document.querySelector(".card");

      let yesScale = 1;
      let currentPhraseIndex = 0;
      let fontSizeHint = 18;
      const phrases = [
        "Oups ! 🏃‍♂️",
        "Raté ! 😜",
        "Essaie encore... 🖱️",
        "Allez dis oui ! ❤️",
        "Tu ne m'aimes pas ? 😭",
      ];

      function teleportNo() {
        // Force le passage en absolute pour bouger librement
        if (noBtn.style.position !== "absolute") {
          noBtn.style.position = "absolute";
        }

        const padding = 30;
        // CALCUL CRUCIAL : On reste dans les limites de la CARTE (cadre blanc)
        const maxX = card.clientWidth - noBtn.offsetWidth - padding;
        const maxY = card.clientHeight - noBtn.offsetHeight - padding;

        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

        noBtn.style.left = `${randomX}px`;
        noBtn.style.top = `${randomY}px`;

        // Mise à jour de l'indice
        if (currentPhraseIndex < phrases.length) {
          hint.innerText = phrases[currentPhraseIndex];
          currentPhraseIndex++;
        } else {
          fontSizeHint += 2;
          hint.style.fontSize = `${fontSizeHint}px`;
        }

        // Grossissement du OUI
        yesScale = Math.min(3, yesScale + 0.15);
        yesBtn.style.transform = `scale(${yesScale})`;
      }

      // Détection pour Souris ET Mobile
      const checkDistance = (x, y) => {
        const b = noBtn.getBoundingClientRect();
        const dist = Math.hypot(
          b.left + b.width / 2 - x,
          b.top + b.height / 2 - y,
        );
        if (dist < 80) teleportNo();
      };

      window.addEventListener("mousemove", (e) =>
        checkDistance(e.clientX, e.clientY),
      );
      window.addEventListener("touchstart", (e) =>
        checkDistance(e.touches[0].clientX, e.touches[0].clientY),
      );

      // Sécurité : si elle clique quand même sur le Non
      noBtn.addEventListener("click", (e) => {
        e.preventDefault();
        teleportNo();
      });

      yesBtn.addEventListener("click", () => {
        mainContent.style.display = "none";
        result.style.display = "block";
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      });
    </script>
  </body>
</html>
