<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Veux-tu être ma Valentine ?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --bg1: #ffd6e7;
        --bg2: #ffeef6;
        --card: #ffffff;
        --yes: #ff3b7a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1));
        font-family: system-ui, sans-serif;
        overflow: hidden;
        padding: 15px;
      }

      .card {
        position: relative; /* CRUCIAL : Définit la zone limite pour le bouton Non */
        width: 100%;
        max-width: 400px;
        background: var(--card);
        border-radius: 30px;
        padding: 30px 20px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 550px;
      }

      .img-container {
        position: relative;
        margin-bottom: 20px;
      }

      .custom-img {
        width: 280px;
        height: 320px;
        object-fit: cover;
        border-radius: 20px;
      }

      .heart-overlay {
        position: absolute;
        top: -10px;
        right: -10px;
        width: 80px;
        filter: drop-shadow(0 5px 10px rgba(255, 59, 122, 0.3));
      }

      h1 {
        font-size: 24px;
        color: #111;
        margin-bottom: 30px;
        padding: 0 10px;
      }

      .button-zone {
        width: 100%;
        height: 120px; /* Espace réservé pour les boutons */
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        position: relative;
      }

      button {
        padding: 12px 25px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 15px;
        border: none;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          background 0.3s;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        -webkit-tap-highlight-color: transparent;
      }

      #yesBtn {
        background: var(--yes);
        color: white;
        z-index: 10;
      }

      #noBtn {
        background: #eef1f5;
        color: #333;
        z-index: 100; /* Toujours au-dessus du bouton Oui */
        white-space: nowrap;
        touch-action: none;
      }

      .hint {
        margin-top: 15px;
        font-weight: bold;
        color: #333;
        font-size: 16px;
      }

      #result {
        display: none;
        width: 100%;
        height: 100%;
      }

      .fireworks {
        width: 100%;
        max-width: 300px;
        border-radius: 20px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div id="main-content">
        <div class="img-container">
          <img src="IMG_8374.JPG" alt="Nous" class="custom-img" />
          <svg
            class="heart-overlay"
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M50 85 C50 75 20 65 20 40 C20 25 35 15 50 30 C65 15 80 25 80 40 C80 65 50 75 50 85Z"
              fill="#ff3b7a"
            />
          </svg>
        </div>

        <h1>Charlise, veux-tu être ma Valentine ?</h1>

        <div class="button-zone" id="zone">
          <button id="yesBtn">Evidemment</button>
          <button id="noBtn">Non 🙄</button>
        </div>

        <div class="hint" id="hint"></div>
      </div>

      <div id="result">
        <h2>YOUPIIIIIIIII ! 🎉</h2>
        <img
          class="fireworks"
          src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3g2bXN3cTB6dWZyaWswNHk2aGJzdm14azg1NDRucDJuZWFzMm8xdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/l6jTwS2sCZ1ztTwgL8/200w.webp"
        />
      </div>
    </main>

    <script>
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const hint = document.getElementById("hint");
      const card = document.querySelector(".card");
      const mainContent = document.getElementById("main-content");
      const result = document.getElementById("result");

      let yesScale = 1;
      let currentPhraseIndex = 0;
      let fontSizeHint = 16;

      const phrases = [
        "Oups ! 🏃‍♂️",
        "Raté ! 😜",
        "Même pas en rêve ! ✨",
        "Allez dis oui ! ❤️",
        "Tu ne m'aimes pas ? 😭",
      ];

      function teleportNo() {
        // Indispensable pour que le bouton bouge par rapport à la CARTE blanche
        if (noBtn.style.position !== "absolute") {
          noBtn.style.position = "absolute";
        }

        // On définit des limites strictes pour rester dans la carte blanche
        const padding = 20;
        const maxX = card.clientWidth - noBtn.offsetWidth - padding;
        const maxY = card.clientHeight - noBtn.offsetHeight - padding;

        // On génère une position aléatoire DANS ces limites
        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";

        // Gérer le texte d'indice
        if (currentPhraseIndex < phrases.length) {
          hint.innerText = phrases[currentPhraseIndex];
          currentPhraseIndex++;
        } else {
          fontSizeHint += 2;
          hint.style.fontSize = fontSizeHint + "px";
        }

        // Faire grossir le bouton OUI
        yesScale = Math.min(3, yesScale + 0.15);
        yesBtn.style.transform = `scale(${yesScale})`;
      }

      // Détection pour Souris et Tactile
      const checkDistance = (x, y) => {
        const rect = noBtn.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const distance = Math.hypot(centerX - x, centerY - y);

        // Si on approche à moins de 70 pixels, on s'enfuit !
        if (distance < 70) teleportNo();
      };

      window.addEventListener("mousemove", (e) =>
        checkDistance(e.clientX, e.clientY),
      );
      window.addEventListener("touchstart", (e) =>
        checkDistance(e.touches[0].clientX, e.touches[0].clientY),
      );

      // Si par miracle elle arrive à cliquer sur "Non"
      noBtn.addEventListener("click", (e) => {
        e.preventDefault();
        teleportNo();
      });

      yesBtn.addEventListener("click", () => {
        mainContent.style.display = "none";
        result.style.display = "block";
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      });
    </script>
  </body>
</html>
