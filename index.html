<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Surprise pour Mon Amoureuse...</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --bg1: #ffd6e7;
        --bg2: #ffeef6;
        --card: #ffffffcc;
        --yes: #ff3b7a;
        --text: #ff1f68;
        --iron: #222;
        --silver: #888;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1));
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }

      /* --- STYLE DE L'HORLOGE INDUSTRIELLE --- */
      .clock-container {
        position: relative;
        width: 220px;
        height: 220px;
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .clock-frame {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 10px solid var(--iron);
        border-radius: 50%;
        box-shadow:
          0 10px 25px rgba(0, 0, 0, 0.2),
          inset 0 0 15px rgba(0, 0, 0, 0.3);
        background: transparent;
      }

      .roman {
        position: absolute;
        width: 20px;
        height: 20px;
        text-align: center;
        /* On utilise des variables pour placer les chiffres en cercle */
        --radius: 85px;
      }
      .r12 {
        transform: translate(0, calc(-1 * var(--radius)));
      }
      .r1 {
        transform: translate(
          calc(0.5 * var(--radius)),
          calc(-0.866 * var(--radius))
        );
      }
      .r2 {
        transform: translate(
          calc(0.866 * var(--radius)),
          calc(-0.5 * var(--radius))
        );
      }
      .r3 {
        transform: translate(var(--radius), 0);
      }
      .r4 {
        transform: translate(
          calc(0.866 * var(--radius)),
          calc(0.5 * var(--radius))
        );
      }
      .r5 {
        transform: translate(
          calc(0.5 * var(--radius)),
          calc(0.866 * var(--radius))
        );
      }
      .r6 {
        transform: translate(0, var(--radius));
      }
      .r7 {
        transform: translate(
          calc(-0.5 * var(--radius)),
          calc(0.866 * var(--radius))
        );
      }
      .r8 {
        transform: translate(
          calc(-0.866 * var(--radius)),
          calc(0.5 * var(--radius))
        );
      }
      .r9 {
        transform: translate(calc(-1 * var(--radius)), 0);
      }
      .r10 {
        transform: translate(
          calc(-0.866 * var(--radius)),
          calc(-0.5 * var(--radius))
        );
      }
      .r11 {
        transform: translate(
          calc(-0.5 * var(--radius)),
          calc(-0.866 * var(--radius))
        );
      }

      .gear-svg {
        position: absolute;
        /* On a enlevé width et animation ici pour laisser les classes spécifiques décider */
        opacity: 0.8;
        filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.4));
        transform-origin: center;
        transform-box: fill-box;
      }
      @keyframes rotate-gear {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes rotate-gear-reverse {
        from {
          transform: rotate(360deg);
        }
        to {
          transform: rotate(0deg);
        }
      }
      .gear-large {
        width: 95px;
        top: 50%;
        left: 50%;
        margin-top: -48px;
        margin-left: -70px; /* On le pousse un peu plus à gauche */
        fill: #333;
        animation: rotate-gear 20s linear infinite;
      }

      .gear-medium {
        width: 80px;
        top: 50%;
        left: 50%;
        margin-top: -65px; /* On le remonte pour qu'il touche le gros */
        margin-left: -5px;
        fill: #8d5524;
        animation: rotate-gear-reverse 15s linear infinite;
      }

      .gear-small {
        width: 60px;
        top: 50%;
        left: 50%;
        margin-top: -5px;
        margin-left: -20px; /* On le centre sous les deux autres */
        fill: #d4af37;
        animation: rotate-gear 10s linear infinite;
      }

      .hand {
        position: absolute;
        bottom: 50%;
        left: 50%;
        transform-origin: bottom center;
        background: var(--iron);
        border-radius: 5px;
        z-index: 10;
        transform: translateX(-50%) rotate(0deg);
      }
      .hour {
        width: 6px;
        height: 50px;
      }
      .minute {
        width: 4px;
        height: 75px;
      }
      .second {
        width: 2px;
        height: 85px;
        background: var(--yes);
      }

      .center-dot {
        position: absolute;
        width: 12px;
        height: 12px;
        background: var(--iron);
        border: 2px solid var(--silver);
        border-radius: 50%;
        z-index: 11;
      }

      /* --- ÉCRAN D'ATTENTE --- */
      #waiting-screen {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 5;
      }

      .countdown-box {
        background: white;
        padding: 20px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(255, 59, 122, 0.1);
      }

      #timer {
        font-size: 32px;
        font-weight: 900;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      /* --- CARTE PROPOSITION --- */
      .card {
        width: 92vw;
        max-width: 420px;
        padding: 30px;
        background: var(--card);
        backdrop-filter: blur(10px);
        border-radius: 22px;
        text-align: center;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.15);
        display: none;
      }

      .img-container img {
        width: 100%;
        border-radius: 15px;
        max-width: 250px;
      }
      h1 {
        font-size: clamp(20px, 4.5vw, 26px);
        margin: 15px 0;
      }
      .button-zone {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
        min-height: 120px;
      }

      button {
        font-size: 20px;
        padding: 12px 24px;
        font-weight: 700;
        border-radius: 15px;
        border: none;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #yesBtn {
        background: var(--yes);
        color: #fff;
      }
      #noGhost {
        visibility: hidden;
        width: auto;
        transition: all 0.3s ease;
      }
      #noBtn {
        background: #e5e7eb;
        color: #111827;
        position: fixed;
        z-index: 9999;
        display: none;
      }
      .hint {
        color: var(--text);
        font-weight: 800;
        min-height: 1.5em;
        margin-bottom: 10px;
      }
      .result {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="waiting-screen">
      <div class="clock-container">
        <div class="clock-frame"></div>
        <svg style="position: absolute; width: 0; height: 0">
          <defs>
            <path
              id="gear-shape"
              d="M50 35c-8.3 0-15 6.7-15 15s6.7 15 15 15 15-6.7 15-15-6.7-15-15-15zm45 10h-7.3c-.5-2.5-1.4-4.8-2.7-7l5.2-5.2c1-1 1-2.6 0-3.5l-4.2-4.2c-1-1-2.6-1-3.5 0l-5.2 5.2c-2.2-1.3-4.5-2.2-7-2.7V15c0-1.4-1.1-2.5-2.5-2.5h-6c-1.4 0-2.5 1.1-2.5 2.5v7.3c-2.5.5-4.8 1.4-7 2.7l-5.2-5.2c-1-1-2.6-1-3.5 0l-4.2 4.2c-1 1-1 2.6 0 3.5l5.2 5.2c-1.3 2.2-2.2 4.5-2.7 7H15c-1.4 0-2.5 1.1-2.5 2.5v6c0 1.4 1.1 2.5 2.5 2.5h7.3c.5 2.5 1.4 4.8 2.7 7l-5.2 5.2c-1 1-1 2.6 0 3.5l4.2 4.2c1 1 2.6 1 3.5 0l5.2-5.2c2.2 1.3 4.5 2.2 7 2.7V95c0 1.4 1.1 2.5 2.5 2.5h6c1.4 0 2.5-1.1 2.5-2.5v-7.3c2.5-.5 4.8-1.4 7-2.7l5.2 5.2c1 1 2.6 1 3.5 0l4.2-4.2c1-1 1-2.6 0-3.5l-5.2-5.2c1.3-2.2 2.2-4.5 2.7-7H95c1.4 0 2.5-1.1 2.5-2.5v-6c0-1.4-1.1-2.5-2.5-2.5z"
            />
          </defs>
        </svg>

        <svg class="gear-svg gear-large" viewBox="0 0 100 100">
          <use href="#gear-shape" />
        </svg>
        <svg class="gear-svg gear-medium" viewBox="0 0 100 100">
          <use href="#gear-shape" />
        </svg>
        <svg class="gear-svg gear-small" viewBox="0 0 100 100">
          <use href="#gear-shape" />
        </svg>
        <div class="roman r12">XII</div>
        <div class="roman r1">I</div>
        <div class="roman r2">II</div>
        <div class="roman r3">III</div>
        <div class="roman r4">IV</div>
        <div class="roman r5">V</div>
        <div class="roman r6">VI</div>
        <div class="roman r7">VII</div>
        <div class="roman r8">VIII</div>
        <div class="roman r9">IX</div>
        <div class="roman r10">X</div>
        <div class="roman r11">XI</div>

        <div class="center-dot"></div>
        <div class="hand hour" id="hourHand"></div>
        <div class="hand minute" id="minHand"></div>
        <div class="hand second" id="secHand"></div>
      </div>

      <h2 style="color: var(--text)">Un peu de patience mon Coeur...</h2>
      <div class="countdown-box">
        <div id="timer">Chargement...</div>
      </div>
      <p style="color: #888; font-style: italic">Rendez-vous le 14 février !</p>
    </div>

    <main class="card" id="main-card">
      <div id="main-content">
        <div class="img-container">
          <img src="IMG_8374.JPG" alt="Valentine" />
        </div>
        <h1>Charlise, veux-tu être ma Valentine ?</h1>
        <div class="hint" id="hint"></div>
        <div class="button-zone">
          <button id="yesBtn">Evidemment</button>
          <button id="noGhost">Non 🙄</button>
        </div>
      </div>

      <div id="result" class="result">
        <h2>YOUPIIIIIIIII ! 🎉</h2>
        <img
          src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3g2bXN3cTB6dWZyaWswNHk2aGJzdm14azg1NDRucDJuZWFzMm8xdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/l6jTwS2sCZ1ztTwgL8/200w.webp"
          style="width: 100%; border-radius: 15px"
        />
      </div>
    </main>

    <button id="noBtn">Non 🙄</button>

    <script>
      const targetDate = new Date("February 14, 2026 12:30:00").getTime();
      const waitingScreen = document.getElementById("waiting-screen");
      const mainCard = document.getElementById("main-card");
      const timerDisplay = document.getElementById("timer");
      const noBtn = document.getElementById("noBtn");

      function updateClock() {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();
        document.getElementById("secHand").style.transform =
          `translateX(-50%) rotate(${(s / 60) * 360}deg)`;
        document.getElementById("minHand").style.transform =
          `translateX(-50%) rotate(${(m / 60) * 360}deg)`;
        document.getElementById("hourHand").style.transform =
          `translateX(-50%) rotate(${(h / 12) * 360 + (m / 60) * 30}deg)`;
      }

      function updateCountdown() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff <= 0) {
          waitingScreen.style.display = "none";
          mainCard.style.display = "block";
          // On laisse 50ms au navigateur pour rendre le DOM visible
          setTimeout(alignInitial, 50);
          return true;
        }

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        timerDisplay.innerText = `${d}j ${h}h ${m}m ${s}s`;
        updateClock();
        return false;
      }

      const timerInterval = setInterval(() => {
        if (updateCountdown()) clearInterval(timerInterval);
      }, 1000);
      updateCountdown();

      // --- LOGIQUE DU BOUTON QUI FUIT ---
      const yesBtn = document.getElementById("yesBtn");
      const noGhost = document.getElementById("noGhost");
      const hint = document.getElementById("hint");
      let yesScale = 1;
      let hasMoved = false;
      let phraseIdx = 0;
      const phrases = [
        "Oups, trop lent ! 🏃‍♂️",
        "Tu as raté ! 😜",
        "Même pas en rêve ! ✨",
        "Allez, fais un effort ! 😤",
        "Essaie encore... 🖱️",
        "Comment ça non ?! 😲",
        "Je vais me vexer... 😢",
        "Allez, dis oui ! ❤️",
        "S'il te plaît... 🙏",
      ];

      function alignInitial() {
        // On vérifie juste si le bouton n'a pas déjà commencé à s'enfuir
        if (!hasMoved) {
          const rect = noGhost.getBoundingClientRect();
          if (rect.left === 0 && rect.top === 0) return; // Sécurité si l'élément n'est pas encore visible

          noBtn.style.left = rect.left + "px";
          noBtn.style.top = rect.top + "px";
          noBtn.style.width = noGhost.offsetWidth + "px";
          noBtn.style.height = noGhost.offsetHeight + "px";
          noBtn.style.display = "block";
        }
      }

      window.addEventListener("load", alignInitial);
      window.addEventListener("resize", alignInitial);
      let fontSize = 16;

      function teleport() {
        if (!hasMoved) {
          noGhost.style.display = "none";
          yesBtn.style.transition = "all 0.3 ease";
        }
        hasMoved = true;
        const margin = 30;
        const maxX = window.innerWidth - noBtn.offsetWidth - margin;
        const maxY = window.innerHeight - noBtn.offsetHeight - margin;
        noBtn.style.left = Math.max(margin, Math.random() * maxX) + "px";
        noBtn.style.top = Math.max(margin, Math.random() * maxY) + "px";

        if (phraseIdx < phrases.length) {
          hint.innerText = phrases[phraseIdx];
          phraseIdx++;
        } else {
          if (fontSize < 26) fontSize += 1;
          hint.innerText = "Tu ne m'aimes pas en fait ? 😭";
          hint.style.fontSize = fontSize + "px";
        }
        if (yesScale < 2) {
          yesScale += 0.1;
          yesBtn.style.transform = `scale(${yesScale})`;
        }
      }

      noBtn.addEventListener("mouseover", teleport);
      noBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        teleport();
      });

      yesBtn.addEventListener("click", () => {
        document.getElementById("main-content").style.display = "none";
        noBtn.style.display = "none";
        document.getElementById("result").style.display = "block";
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      });
    </script>
  </body>
</html>
