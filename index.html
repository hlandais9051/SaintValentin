<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Will you be my Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --bg1: #ffd6e7;
        --bg2: #ffeef6;
        --card: #ffffffcc;
        --yes: #ff3b7a;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1));
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }

      .card {
        width: 92vw;
        max-width: 420px;
        padding: 30px;
        background: var(--card);
        backdrop-filter: blur(10px);
        border-radius: 22px;
        text-align: center;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.15);
      }

      .img-container img {
        width: 100%;
        border-radius: 15px;
        max-width: 250px;
      }
      h1 {
        font-size: clamp(20px, 4.5vw, 26px);
        margin: 15px 0;
      }

      /* ZONE DE BOUTONS : Transition fluide pour le centrage */
      .button-zone {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
        min-height: 120px; /* Espace pour le grossissement du bouton */
      }

      button {
        font-size: 20px;
        padding: 12px 24px;
        font-weight: 700;
        border-radius: 15px;
        border: none;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #yesBtn {
        background: var(--yes);
        color: #fff;
      }

      /* LE BOUTON FANTÔME : Occupe l'espace au début, puis disparait */
      #noGhost {
        visibility: hidden;
        width: auto;
        transition: all 0.3s ease;
      }

      /* LE VRAI BOUTON NON */
      #noBtn {
        background: #e5e7eb;
        color: #111827;
        position: fixed;
        z-index: 9999;
        margin: 0;
      }

      .hint {
        color: #ff1f68;
        font-weight: 800;
        min-height: 1.5em;
        margin-bottom: 10px;
      }
      .result {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div id="main-content">
        <div class="img-container">
          <img src="IMG_8374.JPG" alt="Valentine" />
        </div>
        <h1>Charlise, veux-tu être ma Valentine ?</h1>
        <div class="hint" id="hint"></div>

        <div class="button-zone">
          <button id="yesBtn">Evidemment</button>
          <button id="noGhost">Non 🙄</button>
        </div>
      </div>

      <div id="result" class="result">
        <h2>YOUPIIIIIIIII ! 🎉</h2>
        <img
          src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3g2bXN3cTB6dWZyaWswNHk2aGJzdm14azg1NDRucDJuZWFzMm8xdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/l6jTwS2sCZ1ztTwgL8/200w.webp"
          style="width: 100%; border-radius: 15px"
        />
      </div>
    </main>

    <button id="noBtn">Non 🙄</button>

    <script>
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const noGhost = document.getElementById("noGhost");
      const hint = document.getElementById("hint");

      let yesScale = 1;
      let hasMoved = false;
      let phraseIdx = 0;
      const phrases = [
        "Oups, trop lent ! 🏃‍♂️",
        "Tu as raté ! 😜",
        "Même pas en rêve ! ✨",
        "Allez, fais un effort ! 😤",
        "Essaie encore... 🖱️",
        "Comment ça non ?! 😲",
        "Je vais me vexer... 😢",
        "Allez, dis oui ! ❤️",
        "S'il te plaît... 🙏",
      ];

      // Aligne le vrai bouton sur le fantôme
      function alignInitial() {
        if (!hasMoved) {
          const rect = noGhost.getBoundingClientRect();
          noBtn.style.left = rect.left + "px";
          noBtn.style.top = rect.top + "px";
          noBtn.style.width = noGhost.offsetWidth + "px";
          noBtn.style.height = noGhost.offsetHeight + "px";
        }
      }

      window.addEventListener("load", alignInitial);
      window.addEventListener("resize", alignInitial);

      let fontSize = 16;
      function teleport() {
        if (!hasMoved) {
          // C'EST ICI QUE LA MAGIE OPÈRE :
          // On supprime complètement le bouton fantôme du calcul d'espace
          noGhost.style.display = "none";
          hasMoved = true;
        }

        const margin = 30;
        const maxX = window.innerWidth - noBtn.offsetWidth - margin;
        const maxY = window.innerHeight - noBtn.offsetHeight - margin;

        noBtn.style.left = Math.max(margin, Math.random() * maxX) + "px";
        noBtn.style.top = Math.max(margin, Math.random() * maxY) + "px";

        if (phraseIdx < phrases.length) {
          hint.innerText = phrases[phraseIdx];
          phraseIdx++;
        } else {
          if (fontSize < 26) fontSize += 2;
          hint.innerText = "Tu ne m'aimes pas en fait ? 😭";
          hint.style.fontSize = fontSize + "px";
        }

        // Grossissement du bouton YES
        if (yesScale < 2.2) {
          yesScale += 0.2;
          yesBtn.style.transform = `scale(${yesScale})`;
        }
      }

      noBtn.addEventListener("mouseover", teleport);
      noBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        teleport();
      });

      yesBtn.addEventListener("click", () => {
        document.getElementById("main-content").style.display = "none";
        noBtn.style.display = "none";
        document.getElementById("result").style.display = "block";
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      });
    </script>
  </body>
</html>
