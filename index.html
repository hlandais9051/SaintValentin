<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Will you be my Valentine?</title>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --bg1: #ffd6e7;
        --bg2: #ffeef6;
        --card: #ffffffcc;
        --yes: #ff3b7a;
        --yesHover: #ff1f68;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1));
        font-family: system-ui, sans-serif;
        overflow: hidden;
        padding: 16px;
      }

      #confettiCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999;
      }

      .card {
        max-height: 92vh;
        width: 92vw;
        max-width: 480px;
        padding: 26px 22px;
        background: var(--card);
        backdrop-filter: blur(10px);
        border-radius: 22px;
        text-align: center;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.15);
      }

      /* CONTENEUR POUR LA SUPERPOSITION */
      .img-container {
        position: relative;
        width: fit-content;
        margin: 0 auto 15px;
      }

      .custom-img {
        width: min(250px, 70vw);
        border-radius: 15px;
        display: block;
      }

      /* LE COEUR PAR-DESSUS */
      .heart-overlay {
        position: absolute;
        top: 5%;
        left: 100%;
        transform: translate(-50%, -50%);
        width: 60%; /* Ajuste la taille du coeur ici */
        pointer-events: none; /* Pour ne pas gêner le clic */
        filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
      }

      h1 {
        font-size: clamp(26px, 4vw, 44px);
        margin: 12px 0 18px;
      }

      .button-zone {
        position: relative;
        width: 100%;
        /* On réduit la hauteur sur petit écran pour éviter les trous blancs */
        height: clamp(100px, 20vh, 180px);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(
          10px,
          3vw,
          30px
        ); /* L'espace entre les boutons s'adapte aussi */
        margin: 0 auto;
      }

      button {
        /* Taille du texte : min 16px, idéal 2.5% de la largeur, max 24px */
        font-size: clamp(16px, 2.5vw, 24px);

        /* Padding flexible basé sur la largeur de l'écran */
        padding: clamp(10px, 2vw, 20px) clamp(15px, 4vw, 35px);

        /* Largeur minimale pour garder une belle forme */
        min-width: clamp(100px, 25vw, 160px);

        font-weight: 800;
        border-radius: 15px;
        border: none;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
        user-select: none;
        transition:
          transform 0.12s ease,
          background 0.12s ease;
        white-space: nowrap;
      }

      #yesBtn {
        left: 12%;
        top: 42%;
        background: var(--yes);
        color: #fff;
      }
      #noBtn {
        left: 60%;
        top: 42%;
        background: #e5e7eb;
        color: #111827;
        z-index: 999;
        transition: transform 0.1s ease;
      }

      .result {
        display: none;
        margin-top: 18px;
        animation: pop 0.35s ease;
      }
      .fireworks {
        width: 100%;
        max-width: 400px; /* MAIS elle ne dépassera pas 300px (change ce chiffre pour agrandir/rétrécir) */
        height: auto; /* Garde les bonnes proportions sans déformer */
        border-radius: 15px;
        display: block;
        margin: 0 auto; /* La centre parfaitement */
      }
    </style>
  </head>

  <body>
    <canvas id="confettiCanvas"></canvas>

    <main class="card">
      <div class="img-container">
        <img src="IMG_8374.JPG" alt="Valentine" class="custom-img" />

        <svg
          class="heart-overlay"
          viewBox="0 0 100 100"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient id="heartGrad" x1="0" x2="1">
              <stop offset="0" stop-color="#ff4d7d" />
              <stop offset="1" stop-color="#ff1f68" />
            </linearGradient>
          </defs>
          <path
            d="M50 85 C50 75 20 65 20 40 C20 25 35 15 50 30 C65 15 80 25 80 40 C80 65 50 75 50 85Z"
            fill="url(#heartGrad)"
          />
        </svg>
      </div>

      <h1>Charlise, veux-tu être ma Valentine ?</h1>

      <section class="button-zone" id="zone">
        <button id="yesBtn">Evidemment</button>
        <button id="noBtn">Non 🙄</button>
      </section>

      <div
        class="hint"
        id="hint"
        style="
          font-weight: bold;
          color: #000000;
          margin-top: -60px;
          position: relative;
          z-index: 100;
        "
      ></div>

      <section class="result" id="result">
        <h2>YOUPIIIIIIIII ! 🎉</h2>
        <img
          class="fireworks"
          src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3g2bXN3cTB6dWZyaWswNHk2aGJzdm14azg1NDRucDJuZWFzMm8xdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/l6jTwS2sCZ1ztTwgL8/200w.webp"
          alt="Fireworks"
        />
      </section>
    </main>

    <script>
      const zone = document.getElementById("zone");
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const result = document.getElementById("result");
      const hint = document.getElementById("hint");

      /* ---------- YES BUTTON GROWS ---------- */
      let yesScale = 1;
      function growYes() {
        yesScale = Math.min(2, yesScale + 0.1);
        yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
      }

      const phrases = [
        "Oups, trop lent ! 🏃‍♂️",
        "Tu as raté ! 😜",
        "Tu ne m'auras jamais ! 🤺",
        "Même pas en rêve ! ✨",
        "Essaie encore... 🖱️",
        "Ça commence à faire beaucoup là... 😅",
        "Comment ça, non ? 🙃",
        "Vraiment ? Tu insistes ? 🧐",
        "Je vais finir par me vexer... 😢",
        "Allez, dis oui ! ❤️",
        "C'est long un peu, non ? ⏳",
      ];
      let currentPhraseIndex = 0;
      let i = 16;

      /* ---------- TELEPORT LOGIC ---------- */
      function teleportNo() {
        const padding = 50;
        const maxX = window.innerWidth - noBtn.offsetWidth - padding;
        const maxY = window.innerHeight - noBtn.offsetHeight - padding;

        const randomX = Math.floor(Math.random() * maxX);
        const randomY = Math.floor(Math.random() * maxY);

        noBtn.style.position = "fixed";
        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";

        if (currentPhraseIndex < phrases.length) {
          hint.innerText = phrases[currentPhraseIndex];
          currentPhraseIndex = currentPhraseIndex + 1;
        } else if (currentPhraseIndex >= phrases.length) {
          if (i > 30) i = 30;
          hint.innerText = "Tu ne m'aimes pas ? 😭";
          hint.style.fontSize = `${i}px`;
          i++;
          currentPhraseIndex++;
        }

        growYes();
      }

      // Fonction qui vérifie la distance et téléporte
      const handleInteraction = (clientX, clientY) => {
        const b = noBtn.getBoundingClientRect();
        const d = Math.hypot(
          b.left + b.width / 2 - clientX,
          b.top + b.height / 2 - clientY,
        );
        // Si on s'approche à moins de 80 pixels (souris ou doigt)
        if (d < 80) teleportNo();
      };

      // Événement pour la Souris
      window.addEventListener("mousemove", (e) => {
        handleInteraction(e.clientX, e.clientY);
      });

      // Événement pour le Tactile (Mobile)
      window.addEventListener("touchstart", (e) => {
        handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
      });

      // Sécurité ultime : si elle arrive quand même à cliquer
      noBtn.addEventListener("click", (e) => {
        e.preventDefault();
        teleportNo();
      });

      /* ---------- SUCCESS ---------- */
      yesBtn.addEventListener("click", () => {
        document.querySelector(".img-container").style.display = "none";
        document.querySelector("h1").style.display = "none";
        zone.style.display = "none";
        hint.style.display = "none";
        result.style.display = "block";
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      });
    </script>
  </body>
</html>
